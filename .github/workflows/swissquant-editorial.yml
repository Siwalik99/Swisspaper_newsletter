name: SwissQuant - Réveil éditorial

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: swissquant-editorial
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Vérifier l’échéance du brouillon
        env:
          EDITORIAL_SECRET: ${{ secrets.NEWSLETTER_EDITORIAL_WORKER_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          : "${EDITORIAL_SECRET:?Secret GitHub absent}"

          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 30 \
            --max-time 240 \
            --request POST \
            --header "Authorization: Bearer ${EDITORIAL_SECRET}" \
            --output /dev/null \
            --write-out "HTTP %{http_code}\n" \
            "https://swissquant.net/api/newsletter/editorial/tick"
